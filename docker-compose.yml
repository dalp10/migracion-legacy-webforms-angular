# Entorno de demostración: SQL Server + API.  Solo para desarrollo local.
#   docker compose up --build
# API:     http://localhost:5000/swagger
# Angular: cd angular-app && npm install && npm start  ->  http://localhost:4200
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Demo_Passw0rd!}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Demo_Passw0rd!}
    volumes:
      - ./docker/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -i /init.sql"]

  api:
    build: ./api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # habilita Swagger
      ConnectionStrings__Default: "Server=db;Database=ModuloPedidos;User Id=sa;Password=${SA_PASSWORD:-Demo_Passw0rd!};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY:-clave-solo-para-demo-cambiala-0123456789}
    ports:
      - "5000:8080"
